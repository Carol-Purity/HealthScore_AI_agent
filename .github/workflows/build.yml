name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Azure Functions
        run: dotnet build src/HealthScore.Functions/HealthScore.Functions.csproj --configuration Release

      - name: Check web resource scripts
        run: |
          for f in src/webresources/*.js; do node --check "$f"; done
          for f in src/webresources/*.html; do
            name=$(basename "$f" .html)
            awk '/<script>/{flag=1;next}/<\/script>/{flag=0}flag' "$f" > "/tmp/$name.js"
            node --check "/tmp/$name.js"
          done

      - name: Check Copilot connector definition
        run: node -e "JSON.parse(require('fs').readFileSync('src/copilot-studio/connector/HealthScoreDesigner.swagger.json','utf8'))"
